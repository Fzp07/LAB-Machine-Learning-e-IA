<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - IA System</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Specific adjustments for login */
        .glass-card { max-width: 450px; width: 100%; margin: auto; }
    </style>
</head>
<body>
    <canvas id="neural-canvas"></canvas>

    <main class="container">
        <div class="glass-card">
            <div class="glow-orb"></div>
            <h1 class="glitch" data-text="Acceso al Sistema">Acceso al Sistema</h1>
            <p class="subtitle">Identificación Requerida <span class="cursor">_</span></p>

            <form id="login-form" class="ai-form">
                <div class="input-group">
                    <input type="text" id="usuario" name="usuario" required placeholder=" ">
                    <label for="usuario">Usuario</label>
                </div>
                <div class="input-group">
                    <input type="password" id="password" name="password" required placeholder=" ">
                    <label for="password">Contraseña</label>
                </div>

                <div class="status-bar">
                    <div class="status-fill"></div>
                </div>
                <button type="submit" class="action-btn" id="login-btn">Entrar</button>
            </form>
            
            <div style="margin-top: 1.5rem;">
                <p style="color: var(--text-muted); font-size: 0.9rem;">
                    ¿No tienes cuenta? <a href="registro.html" style="color: var(--primary-glow); text-decoration: none;">Regístrate aquí</a>
                </p>
            </div>
            
            <p id="form-msg" class="form-msg"></p>
        </div>
    </main>

    <script src="login.js"></script>
</body>
</html>
