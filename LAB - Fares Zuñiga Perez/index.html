<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hola Mundo - IA Theme</title>
    <meta name="description" content="Un sitio web llamativo de Hola Mundo con temática de Inteligencia Artificial">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .logout-btn {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 0.5rem 1.5rem;
            border-radius: 20px;
            cursor: pointer;
            margin-top: 2rem;
            transition: all 0.3s;
            font-family: inherit;
        }

        .logout-btn:hover {
            color: white;
            border-color: #ff3366;
            box-shadow: 0 0 10px rgba(255, 51, 102, 0.3);
        }
    </style>
</head>

<body>
    <canvas id="neural-canvas"></canvas>

    <main class="container">
        <div class="glass-card">
            <div class="glow-orb"></div>
            <h1 class="glitch" data-text="Curso de IA">Curso de IA</h1>
            <p class="subtitle">Formulario de Inscripción <span class="cursor">_</span></p>

            <form id="registro-form" class="ai-form">
                <div class="input-group">
                    <input type="text" id="nombre" name="nombre" required placeholder=" ">
                    <label for="nombre">Nombre Completo</label>
                </div>
                <div class="input-group">
                    <input type="email" id="correo" name="correo" required placeholder=" ">
                    <label for="correo">Correo Electrónico</label>
                </div>
                <div class="input-group">
                    <input type="tel" id="telefono" name="telefono" required placeholder=" ">
                    <label for="telefono">Teléfono</label>
                </div>

                <div class="status-bar">
                    <div class="status-fill"></div>
                </div>
                <button type="submit" class="action-btn" id="submit-btn">Inscribirse</button>
                <button type="button" class="logout-btn" onclick="window.location.href='login.html'">Cerrar
                    Sesión</button>
            </form>
            <p id="form-msg" class="form-msg"></p>
        </div>
    </main>

    <script src="script.js"></script>
</body>

</html>
