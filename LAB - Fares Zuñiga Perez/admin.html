<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administrador - IA System</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .glass-card {
            max-width: 800px;
            width: 90%;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 2rem;
            text-align: left;
        }

        th,
        td {
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            color: var(--primary-glow);
            font-weight: 500;
        }

        tr:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .logout-btn {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 0.5rem 1.5rem;
            border-radius: 20px;
            cursor: pointer;
            margin-top: 2rem;
            transition: all 0.3s;
        }

        .logout-btn:hover {
            color: white;
            border-color: #ff3366;
            box-shadow: 0 0 10px rgba(255, 51, 102, 0.3);
        }
    </style>
</head>

<body>
    <canvas id="neural-canvas"></canvas>

    <main class="container">
        <div class="glass-card">
            <h1 class="glitch" data-text="Panel Administrativo">Panel Administrativo</h1>
            <p class="subtitle">Registros del Curso de IA <span class="cursor">_</span></p>

            <div id="table-container">
                <p style="color: var(--text-muted);">Cargando registros...</p>
            </div>

            <button class="logout-btn" onclick="window.location.href='login.html'">Cerrar Sesión</button>
        </div>
    </main>

    <script src="admin.js"></script>
</body>

</html>
